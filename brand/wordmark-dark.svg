<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 240" role="img" aria-label="Manifold logo lockup">
  <title>Manifold</title>
  <desc>{ | } MANIFOLD — full lockup with brand mark and wordmark. For use in app chrome, headers, signatures.</desc>

  <defs>
    <linearGradient id="braceWL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FFFCF2"/>
      <stop offset="50%"  stop-color="#F1ECE0"/>
      <stop offset="100%" stop-color="#B8B0A0"/>
    </linearGradient>
    <linearGradient id="barWL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F1ECE0" stop-opacity="0.78"/>
      <stop offset="50%" stop-color="#F1ECE0"/>
      <stop offset="100%" stop-color="#F1ECE0" stop-opacity="0.78"/>
    </linearGradient>
    <radialGradient id="haloWL" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE0B2" stop-opacity="0.30"/>
      <stop offset="65%" stop-color="#FFE0B2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Mark group -->
  <g transform="translate(0, 0)">
    <ellipse cx="200" cy="120" rx="80" ry="100" fill="url(#haloWL)"/>
    <g transform="translate(80, 0)">
      <path d="M 64 8 C 36 8, 26 18, 26 40 L 26 100
               C 26 110, 18 116, 6 120
               C 18 124, 26 130, 26 140 L 26 200
               C 26 222, 36 232, 64 232"
            fill="none" stroke="url(#braceWL)" stroke-width="3.5"
            stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <rect x="198" y="50" width="4" height="140" rx="2" fill="url(#barWL)"/>
    <g transform="translate(240, 0)">
      <path d="M 16 8 C 44 8, 54 18, 54 40 L 54 100
               C 54 110, 62 116, 74 120
               C 62 124, 54 130, 54 140 L 54 200
               C 54 222, 44 232, 16 232"
            fill="none" stroke="url(#braceWL)" stroke-width="3.5"
            stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="430" y="142" font-family="'SF Pro Display','Inter',system-ui,sans-serif"
        font-weight="300" font-size="60" letter-spacing="32" fill="#D6D0C2">MANIFOLD</text>
</svg>
