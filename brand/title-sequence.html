<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manifold — Title Sequence</title>
<style>
  /* ============================================================
     MANIFOLD — TITLE SEQUENCE
     ------------------------------------------------------------
     Drop-in self-contained animation. Embed via <iframe> on web
     or copy <style> + <body> contents into a hero section.
     Tune --speed to scale all timing (1 = cinematic, 2.5 = splash).
     ============================================================ */

  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&display=swap');

  :root {
    /* Palette — warm off-blacks and warm off-whites. No pure values. */
    --bg-deep:   #050507;
    --bg-lift:   #0E0E11;
    --ink:       #F2EEE3;     /* warm bone for the mark */
    --ink-soft:  #D8D3C6;     /* wordmark */
    --ink-mute:  #6B6760;     /* tagline */
    --gate:      #FFE3BC;     /* warm halo behind the bar */
    --pulse:     #FFFFFF;     /* the inspection photon */

    /* Timing — change one number to retime the entire sequence.
       1.0 = cinematic 6.6s reveal. 2.5 = ~2.6s app splash. */
    --speed: 1.0;
    --t-seed-in:    calc(800ms / var(--speed));
    --t-brace:      calc(1400ms / var(--speed));
    --t-bar:        calc(900ms / var(--speed));
    --t-pulse:      calc(1300ms / var(--speed));
    --t-word:       calc(1100ms / var(--speed));
    --t-tag:        calc(900ms / var(--speed));

    --d-seed:       calc(200ms / var(--speed));
    --d-brace-l:    calc(1000ms / var(--speed));
    --d-brace-r:    calc(1300ms / var(--speed));
    --d-bar:        calc(2500ms / var(--speed));
    --d-pulse:      calc(3800ms / var(--speed));
    --d-word:       calc(5100ms / var(--speed));
    --d-tag:        calc(5700ms / var(--speed));
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg-deep);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    text-rendering: geometricPrecision;
  }

  /* ---------- Stage ---------- */
  .stage {
    position: relative;
    width: 100%;
    height: 100vh;
    display: grid;
    place-items: center;
    /* subtle warmth radiating from center; never reaches edges */
    background:
      radial-gradient(ellipse 60% 50% at 50% 48%, var(--bg-lift) 0%, var(--bg-deep) 70%);
    cursor: pointer;
    user-select: none;
  }

  /* Film grain — kept subtle. Lifts the digital flatness without dazzle. */
  .stage::after {
    content: '';
    position: absolute;
    inset: -10%;
    pointer-events: none;
    opacity: 0.35;
    mix-blend-mode: overlay;
    background-image:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.95' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.95  0 0 0 0 0.93  0 0 0 0 0.88  0 0 0 0.10 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  /* ---------- Composition ---------- */
  .composition {
    position: relative;
    width: min(720px, 86vw);
    aspect-ratio: 16 / 10;
    display: grid;
    grid-template-rows: 1fr auto auto;
    align-items: center;
    justify-items: center;
  }

  /* The mark — { | } */
  .mark {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    width: 100%;
  }

  /* Soft warm halo behind the bar (the "gate is open" light) */
  .halo {
    position: absolute;
    width: 220px;
    height: 360px;
    background:
      radial-gradient(ellipse 50% 60% at 50% 50%,
        color-mix(in srgb, var(--gate) 32%, transparent) 0%,
        transparent 70%);
    filter: blur(18px);
    opacity: 0;
    animation: halo-rise var(--t-bar) cubic-bezier(0.65, 0, 0.35, 1) var(--d-bar) forwards,
               halo-breathe 7s ease-in-out calc(var(--d-pulse) + var(--t-pulse) + 1500ms) infinite;
  }

  /* Seed line — faint horizontal hairline that precedes everything */
  .seed {
    position: absolute;
    width: 240px;
    height: 1px;
    background: linear-gradient(90deg,
      transparent 0%,
      color-mix(in srgb, var(--ink) 40%, transparent) 30%,
      color-mix(in srgb, var(--ink) 40%, transparent) 70%,
      transparent 100%);
    transform: scaleX(0);
    transform-origin: center;
    opacity: 0;
    animation:
      seed-in   var(--t-seed-in) cubic-bezier(0.22, 1, 0.36, 1) var(--d-seed) forwards,
      seed-out  600ms cubic-bezier(0.4, 0, 1, 1) calc(var(--d-bar) - 200ms) forwards;
  }

  /* Braces — large, refined, drawn with display weight Inter
     (Inter's curly braces are unusually elegant at display sizes) */
  .brace {
    font-family: 'Inter', system-ui, sans-serif;
    font-weight: 200;
    font-size: clamp(180px, 28vw, 280px);
    line-height: 1;
    color: var(--ink);
    display: inline-block;
    /* Reveal grows from cusp midline outward, top and bottom simultaneously */
    clip-path: inset(50% 0 50% 0);
    opacity: 0;
    /* Tiny optical refinement so braces don't feel chalky on dark bg */
    text-shadow: 0 0 32px color-mix(in srgb, var(--ink) 6%, transparent);
  }

  .brace.left {
    margin-right: 56px;
    animation:
      brace-grow var(--t-brace) cubic-bezier(0.16, 1, 0.3, 1) var(--d-brace-l) forwards,
      brace-settle 600ms ease-out calc(var(--d-brace-l) + var(--t-brace)) forwards;
  }

  .brace.right {
    margin-left: 56px;
    animation:
      brace-grow var(--t-brace) cubic-bezier(0.16, 1, 0.3, 1) var(--d-brace-r) forwards,
      brace-settle 600ms ease-out calc(var(--d-brace-r) + var(--t-brace)) forwards;
  }

  /* The vertical bar — the gate */
  .bar {
    position: absolute;
    width: 4px;
    height: 220px;
    border-radius: 2px;
    background: linear-gradient(180deg,
      color-mix(in srgb, var(--ink) 80%, transparent) 0%,
      var(--ink) 50%,
      color-mix(in srgb, var(--ink) 80%, transparent) 100%);
    box-shadow:
      0 0 18px color-mix(in srgb, var(--gate) 35%, transparent),
      0 0 4px  color-mix(in srgb, var(--ink) 30%, transparent);
    transform: scaleY(0);
    transform-origin: center;
    opacity: 0;
    animation: bar-rise var(--t-bar) cubic-bezier(0.65, 0, 0.35, 1) var(--d-bar) forwards;
  }

  /* Pulse — single photon traverses the bar */
  .pulse {
    position: absolute;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--pulse);
    box-shadow:
      0 0 12px var(--pulse),
      0 0 24px color-mix(in srgb, var(--gate) 60%, transparent),
      0 0 48px color-mix(in srgb, var(--gate) 30%, transparent);
    opacity: 0;
    transform: translateY(-110px);
    animation: pulse-pass var(--t-pulse) cubic-bezier(0.4, 0, 0.2, 1) var(--d-pulse) forwards,
               pulse-loop 7s cubic-bezier(0.4, 0, 0.2, 1) calc(var(--d-pulse) + var(--t-pulse) + 2000ms) infinite;
  }

  /* Wordmark */
  .wordmark {
    margin-top: 48px;
    font-family: 'Inter', system-ui, sans-serif;
    font-weight: 300;
    font-size: clamp(20px, 2.4vw, 28px);
    letter-spacing: 0.62em;
    text-indent: 0.62em;       /* compensate trailing tracking */
    color: var(--ink-soft);
    opacity: 0;
    transform: translateY(6px);
    animation: word-rise var(--t-word) cubic-bezier(0.22, 1, 0.36, 1) var(--d-word) forwards;
  }

  .tagline {
    margin-top: 18px;
    font-family: 'Inter', system-ui, sans-serif;
    font-weight: 300;
    font-size: clamp(10px, 1.05vw, 12px);
    letter-spacing: 0.32em;
    text-indent: 0.32em;
    color: var(--ink-mute);
    opacity: 0;
    animation: tag-rise var(--t-tag) ease-out var(--d-tag) forwards;
  }

  /* ---------- Keyframes ---------- */

  @keyframes seed-in {
    0%   { transform: scaleX(0); opacity: 0; }
    100% { transform: scaleX(1); opacity: 0.9; }
  }
  @keyframes seed-out {
    0%   { opacity: 0.9; }
    100% { opacity: 0; }
  }

  @keyframes brace-grow {
    0%   { clip-path: inset(50% 0 50% 0); opacity: 0; }
    18%  { opacity: 1; }
    100% { clip-path: inset(0 0 0 0);     opacity: 1; }
  }
  @keyframes brace-settle {
    /* a barely-perceptible weight settle; sells the "arrival with authority" */
    0%   { transform: translateY(-1.5px); }
    100% { transform: translateY(0); }
  }

  @keyframes bar-rise {
    0%   { transform: scaleY(0);     opacity: 0; }
    60%  { transform: scaleY(1.04);  opacity: 1; }   /* slight overshoot */
    100% { transform: scaleY(1);     opacity: 1; }
  }

  @keyframes halo-rise {
    0%   { opacity: 0; transform: scale(0.85); }
    100% { opacity: 0.55; transform: scale(1); }
  }
  @keyframes halo-breathe {
    0%, 100% { opacity: 0.45; }
    50%      { opacity: 0.65; }
  }

  @keyframes pulse-pass {
    0%   { transform: translateY(-110px); opacity: 0; }
    15%  { opacity: 1; }
    85%  { opacity: 1; }
    100% { transform: translateY(110px);  opacity: 0; }
  }
  @keyframes pulse-loop {
    0%, 92% { transform: translateY(-110px); opacity: 0; }
    93%     { opacity: 0; }
    96%     { opacity: 1; }
    99%     { opacity: 1; }
    100%    { transform: translateY(110px);  opacity: 0; }
  }

  @keyframes word-rise {
    0%   { opacity: 0; transform: translateY(6px); }
    100% { opacity: 1; transform: translateY(0);  }
  }

  @keyframes tag-rise {
    0%   { opacity: 0; }
    100% { opacity: 0.9; }
  }

  /* ---------- Reduced motion ---------- */
  @media (prefers-reduced-motion: reduce) {
    .seed, .brace, .bar, .halo, .pulse, .wordmark, .tagline {
      animation: none !important;
      opacity: 1 !important;
      transform: none !important;
      clip-path: none !important;
    }
    .seed { display: none; }
  }

  /* ---------- App splash variant ----------
     Add class="splash" to .stage to compress to ~2.6s for app launch. */
  .stage.splash { --speed: 2.5; }

  /* ---------- Light mode (optional) ---------- */
  .stage.light {
    --bg-deep: #F6F3EC;
    --bg-lift: #FFFFFF;
    --ink:    #15140F;
    --ink-soft: #2C2A24;
    --ink-mute: #807C72;
    --gate:   #B86A1E;
    --pulse:  #FFFFFF;
  }
</style>
</head>
<body>

  <div class="stage" id="stage">
    <div class="composition">
      <div class="mark">
        <div class="halo"   aria-hidden="true"></div>
        <div class="seed"   aria-hidden="true"></div>
        <span class="brace left"  aria-hidden="true">{</span>
        <div class="bar"    aria-hidden="true"></div>
        <div class="pulse"  aria-hidden="true"></div>
        <span class="brace right" aria-hidden="true">}</span>
      </div>
      <div class="wordmark">MANIFOLD</div>
      <div class="tagline">ACCESS, RECORDED.</div>
    </div>
  </div>

  <script>
    // Click anywhere to replay the sequence — useful while iterating.
    // Remove this block in production embeds.
    (function () {
      const stage = document.getElementById('stage');
      stage.addEventListener('click', () => {
        const fresh = stage.cloneNode(true);
        stage.parentNode.replaceChild(fresh, stage);
        fresh.id = 'stage';
        fresh.addEventListener('click', () => location.reload());
      });
    })();
  </script>

</body>
</html>
