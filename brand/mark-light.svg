<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img" aria-label="Manifold brand mark">
  <title>Manifold</title>
  <desc>{ | } — the brand mark for Manifold. Light variant for use on light backgrounds.</desc>

  <defs>
    <linearGradient id="braceGradL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#2C2A24"/>
      <stop offset="50%"  stop-color="#15140F"/>
      <stop offset="100%" stop-color="#0A0907"/>
    </linearGradient>
    <linearGradient id="barGradL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#15140F" stop-opacity="0.78"/>
      <stop offset="50%"  stop-color="#15140F"/>
      <stop offset="100%" stop-color="#15140F" stop-opacity="0.78"/>
    </linearGradient>
    <radialGradient id="haloL" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#B86A1E" stop-opacity="0.18"/>
      <stop offset="65%" stop-color="#B86A1E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="200" cy="120" rx="80" ry="100" fill="url(#haloL)"/>

  <g transform="translate(80, 0)">
    <path d="M 64 8 C 36 8, 26 18, 26 40 L 26 100
             C 26 110, 18 116, 6 120
             C 18 124, 26 130, 26 140 L 26 200
             C 26 222, 36 232, 64 232"
          fill="none" stroke="url(#braceGradL)" stroke-width="3.5"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <rect x="198" y="50" width="4" height="140" rx="2" fill="url(#barGradL)"/>

  <g transform="translate(240, 0)">
    <path d="M 16 8 C 44 8, 54 18, 54 40 L 54 100
             C 54 110, 62 116, 74 120
             C 62 124, 54 130, 54 140 L 54 200
             C 54 222, 44 232, 16 232"
          fill="none" stroke="url(#braceGradL)" stroke-width="3.5"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
