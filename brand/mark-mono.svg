<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img" aria-label="Manifold brand mark">
  <title>Manifold</title>
  <desc>{ | } — monochrome brand mark. Inherits currentColor for use as a CSS-color icon. Set fill via CSS.</desc>

  <!-- Single-color version. Uses currentColor so embedding context controls color.
       Use case:
         <svg style="color: white"><use href="mark-mono.svg"/></svg>
       Or as <img>: pair with CSS filter to recolor.
       Stroke is the same single brace path used in the title sequence. -->

  <g fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left brace -->
    <path d="M 144 8 C 116 8, 106 18, 106 40 L 106 100
             C 106 110, 98 116, 86 120
             C 98 124, 106 130, 106 140 L 106 200
             C 106 222, 116 232, 144 232"/>
    <!-- Bar -->
    <line x1="200" y1="50" x2="200" y2="190"/>
    <!-- Right brace -->
    <path d="M 256 8 C 284 8, 294 18, 294 40 L 294 100
             C 294 110, 302 116, 314 120
             C 302 124, 294 130, 294 140 L 294 200
             C 294 222, 284 232, 256 232"/>
  </g>
</svg>
