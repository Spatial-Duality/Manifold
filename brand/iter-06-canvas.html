<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Manifold — Iter 06 (Canvas Experiment)</title>
<style>
  /* ITERATION 6 — Canvas-based experiment.
     Hypothesis: Canvas with additive blending + 300 particles +
     frame-accumulation trails surpasses iter 5 in cinematic feel.

     Differences from iter 05:
       - Particle field renders in <canvas> with hi-DPI support
       - globalCompositeOperation = 'lighter' (additive bloom)
       - Frame accumulation: previous frame fades 0.15 alpha rather than
         clear — gives real exponentially-decaying trails
       - 300 particles instead of 120
       - No SVG bloom layer needed (additive blending replaces it)
       - No discrete trail circles (frame accumulation replaces them)
       - Smaller individual atoms (1.0px) but more of them
     Braces, halos, wordmark, tagline remain SVG/CSS as iter 5. */

  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&display=swap');

  :root {
    --bg-deep: #050507;
    --bg-lift: #101013;
    --ink: #F1ECE0;
    --ink-warm: #FFD9A0;
    --ink-cold: #B8C8E0;
    --ink-soft: #D6D0C2;
    --ink-mute: #6A665E;
    --gate: #FFE0B2;
    --pulse: #FFFFFF;
    --ease-cinematic: cubic-bezier(0.16, 1, 0.3, 1);
    --ease-confident: cubic-bezier(0.65, 0, 0.35, 1);
    --ease-material: cubic-bezier(0.4, 0, 0.2, 1);
  }

  *,*::before,*::after { margin:0; padding:0; box-sizing: border-box; }
  html, body {
    height: 100%; background: var(--bg-deep);
    font-family: 'SF Pro Display','Inter',system-ui,sans-serif;
    overflow: hidden; -webkit-font-smoothing: antialiased; color: var(--ink);
  }

  .stage {
    position: relative; width: 100%; height: 100vh;
    display: grid; place-items: center;
    background:
      radial-gradient(ellipse 30% 20% at 50% 47%, color-mix(in srgb, var(--ink-warm) 5%, transparent) 0%, transparent 70%),
      radial-gradient(ellipse 70% 55% at 50% 47%, var(--bg-lift) 0%, var(--bg-deep) 75%);
    cursor: pointer;
  }

  .stage::after {
    content: ''; position: absolute; inset: 0; pointer-events: none; opacity: 0.5; mix-blend-mode: overlay;
    background:
      radial-gradient(ellipse 50% 40% at 50% 50%, transparent 0%, rgba(0,0,0,0.45) 100%),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.92  0 0 0 0 0.90  0 0 0 0 0.84  0 0 0 0.10 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    background-blend-mode: multiply;
  }

  .composition {
    position: relative;
    width: min(820px, 92vw);
    aspect-ratio: 16 / 11;
    display: grid;
    grid-template-rows: 1fr auto auto;
    align-items: center;
    justify-items: center;
    perspective: 1400px;
  }

  .mark {
    position: relative; width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    transform-style: preserve-3d;
    animation: drift 14s ease-in-out infinite;
  }

  .halo, .halo-far, .halo-cold {
    position: absolute; border-radius: 50%; pointer-events: none; opacity: 0;
    transition: opacity 280ms var(--ease-material);
  }
  .halo {
    width: 280px; height: 360px;
    background: radial-gradient(ellipse 50% 60% at 50% 50%,
      color-mix(in srgb, var(--gate) 42%, transparent) 0%, transparent 65%);
    filter: blur(18px);
    animation: halo-rise 1100ms var(--ease-confident) 2400ms forwards;
    transform: translateZ(-20px);
  }
  .halo-far {
    width: 540px; height: 480px;
    background: radial-gradient(circle, color-mix(in srgb, var(--gate) 14%, transparent) 0%, transparent 60%);
    filter: blur(46px);
    animation: halo-far-rise 1500ms var(--ease-confident) 2200ms forwards;
    transform: translateZ(-60px);
  }
  .halo-cold {
    width: 380px; height: 420px;
    background: radial-gradient(ellipse 50% 55% at 50% 50%,
      color-mix(in srgb, var(--ink-cold) 10%, transparent) 0%, transparent 70%);
    filter: blur(32px);
    animation: halo-cold-rise 1700ms var(--ease-confident) 2300ms forwards;
    transform: translateZ(-40px);
  }
  .halo.flash { opacity: 0.92 !important; }

  .seed {
    position: absolute;
    width: 220px; height: 1px;
    background: linear-gradient(90deg, transparent 0%,
      color-mix(in srgb, var(--ink) 60%, transparent) 50%, transparent 100%);
    transform: scaleX(0);
    opacity: 0;
    animation:
      seed-in 1000ms var(--ease-cinematic) 600ms forwards,
      seed-out 700ms ease-in 2300ms forwards;
  }

  .brace-svg {
    height: clamp(220px, 32vw, 320px);
    width: auto; overflow: visible; opacity: 0;
  }
  .brace-svg.left {
    margin-right: 92px;
    clip-path: circle(0% at 0% 50%);
    animation: iris-left 1500ms var(--ease-cinematic) 1200ms forwards,
               brace-breathe 9s ease-in-out 4000ms infinite;
    transform: translateZ(20px);
  }
  .brace-svg.right {
    margin-left: 92px;
    clip-path: circle(0% at 100% 50%);
    animation: iris-right 1500ms var(--ease-cinematic) 1500ms forwards,
               brace-breathe 9s ease-in-out 4300ms infinite;
    transform: translateZ(20px);
  }

  /* Canvas slot */
  .slot-wrap { position: absolute; width: 360px; height: 280px; pointer-events: none; }
  .slot-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .slot-wrap.aberrating {
    filter: drop-shadow(1px 0 0 rgba(255, 120, 120, 0.35))
            drop-shadow(-1px 0 0 rgba(120, 160, 255, 0.35));
  }
  .slot-wrap.punch {
    filter: brightness(1.3) drop-shadow(0 0 6px var(--pulse));
  }
  .slot-wrap.aberrating, .slot-wrap.punch {
    transition: filter 180ms var(--ease-material);
  }

  .wordmark {
    margin-top: 56px;
    font-family: 'SF Pro Display','Inter',system-ui,sans-serif;
    font-weight: 300; font-size: clamp(20px, 2.4vw, 30px);
    color: var(--ink-soft);
    display: flex; gap: 0.55em;
  }
  .wordmark .ltr {
    display: inline-block; opacity: 0; transform: translateY(10px);
    animation: ltr-rise 700ms var(--ease-cinematic) forwards;
  }
  .tagline {
    margin-top: 22px; font-size: clamp(10px, 1.05vw, 12px);
    letter-spacing: 0.34em; text-indent: 0.34em;
    color: var(--ink-mute); opacity: 0;
    animation: tag-rise 900ms ease-out 6400ms forwards;
  }

  @keyframes seed-in { 0%{transform:scaleX(0);opacity:0;} 100%{transform:scaleX(1);opacity:0.9;} }
  @keyframes seed-out { to { opacity: 0; } }
  @keyframes iris-left { 0%{clip-path:circle(0% at 0% 50%);opacity:0;} 18%{opacity:1;} 100%{clip-path:circle(140% at 0% 50%);opacity:1;} }
  @keyframes iris-right { 0%{clip-path:circle(0% at 100% 50%);opacity:0;} 18%{opacity:1;} 100%{clip-path:circle(140% at 100% 50%);opacity:1;} }
  @keyframes halo-rise { to { opacity: 0.55; } }
  @keyframes halo-far-rise { to { opacity: 0.6; } }
  @keyframes halo-cold-rise { to { opacity: 0.65; } }
  @keyframes brace-breathe { 0%,100%{transform:translateZ(20px) scale(1);} 50%{transform:translateZ(20px) scale(1.006);} }
  @keyframes ltr-rise { to { opacity: 1; transform: translateY(0); } }
  @keyframes tag-rise { to { opacity: 0.8; } }
  @keyframes drift {
    0%,100% { transform: translate3d(0,0,0); }
    25%     { transform: translate3d(-3px,1px,0); }
    50%     { transform: translate3d(2px,-2px,0); }
    75%     { transform: translate3d(-1px,2px,0); }
  }

  @media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation: none !important; } }
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="composition">
    <div class="mark" id="mark">
      <div class="halo-cold" aria-hidden="true"></div>
      <div class="halo-far" aria-hidden="true"></div>
      <div class="halo" id="halo" aria-hidden="true"></div>
      <div class="seed" aria-hidden="true"></div>

      <svg class="brace-svg left" viewBox="0 0 80 240" aria-hidden="true">
        <defs>
          <linearGradient id="bgL" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#FFFCF2"/><stop offset="50%" stop-color="#F1ECE0"/><stop offset="100%" stop-color="#B8B0A0"/>
          </linearGradient>
          <filter id="glL" x="-30%" y="-10%" width="160%" height="120%"><feGaussianBlur stdDeviation="1.0"/></filter>
        </defs>
        <path d="M 64 8 C 36 8, 26 18, 26 40 L 26 100 C 26 110, 18 116, 6 120 C 18 124, 26 130, 26 140 L 26 200 C 26 222, 36 232, 64 232"
              fill="none" stroke="url(#bgL)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glL)"/>
        <path d="M 64 8 C 36 8, 26 18, 26 40 L 26 100 C 26 110, 18 116, 6 120 C 18 124, 26 130, 26 140 L 26 200 C 26 222, 36 232, 64 232"
              fill="none" stroke="rgba(255,255,255,0.20)" stroke-width="0.8" stroke-linecap="round" transform="translate(0,-0.5)"/>
      </svg>

      <div class="slot-wrap" id="slotWrap">
        <canvas class="slot-canvas" id="slot"></canvas>
      </div>

      <svg class="brace-svg right" viewBox="0 0 80 240" aria-hidden="true">
        <defs>
          <linearGradient id="bgR" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#FFFCF2"/><stop offset="50%" stop-color="#F1ECE0"/><stop offset="100%" stop-color="#B8B0A0"/>
          </linearGradient>
          <filter id="glR" x="-30%" y="-10%" width="160%" height="120%"><feGaussianBlur stdDeviation="1.0"/></filter>
        </defs>
        <path d="M 16 8 C 44 8, 54 18, 54 40 L 54 100 C 54 110, 62 116, 74 120 C 62 124, 54 130, 54 140 L 54 200 C 54 222, 44 232, 16 232"
              fill="none" stroke="url(#bgR)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glR)"/>
        <path d="M 16 8 C 44 8, 54 18, 54 40 L 54 100 C 54 110, 62 116, 74 120 C 62 124, 54 130, 54 140 L 54 200 C 54 222, 44 232, 16 232"
              fill="none" stroke="rgba(255,255,255,0.20)" stroke-width="0.8" stroke-linecap="round" transform="translate(0,-0.5)"/>
      </svg>
    </div>

    <div class="wordmark" id="wordmark"></div>
    <div class="tagline">ACCESS, RECORDED.</div>
  </div>
</div>

<script>
(function () {
  /* === Wordmark stagger === */
  const wm = document.getElementById('wordmark');
  'MANIFOLD'.split('').forEach((ch, i) => {
    const span = document.createElement('span');
    span.className = 'ltr'; span.textContent = ch;
    span.style.animationDelay = `${5200 + i * 80}ms`;
    wm.appendChild(span);
  });

  /* === Canvas particle system === */
  const ATOM_COUNT = 280;
  const canvas = document.getElementById('slot');
  const ctx = canvas.getContext('2d');
  const HALO = document.getElementById('halo');
  const SLOT_WRAP = document.getElementById('slotWrap');

  // HiDPI setup — render at devicePixelRatio for crisp particles
  let DPR = Math.min(window.devicePixelRatio || 1, 2);
  let W = 0, H = 0;
  function resize() {
    const rect = canvas.getBoundingClientRect();
    W = rect.width; H = rect.height;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  // Defer initial sizing until layout settles
  requestAnimationFrame(() => { resize(); requestAnimationFrame(resize); });

  function ease(t) { return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2; }

  // Color palette in RGB tuples (so we can do alpha math directly)
  const C_INK     = [241, 236, 224];
  const C_WARM    = [255, 217, 160];
  const C_COLD    = [184, 200, 224];
  function rgba(c, a) { return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }

  class Atom {
    constructor(idx) {
      this.idx = idx;
      const r = Math.random();
      this.color = r < 0.92 ? C_INK : (r < 0.99 ? C_WARM : C_COLD);
      this.x = (Math.random() - 0.5) * 700;
      this.y = (Math.random() - 0.5) * 500;
      this.sx = this.x; this.sy = this.y;
      this.tx = 0; this.ty = 0;
      this.cpx = 0; this.cpy = 0;
      this.delay = 0; this.duration = 900; this.tStart = 0;
      const t = (idx / (ATOM_COUNT - 1) - 0.5) * 2;
      this.size = 1.2 - Math.abs(t) * 0.3;
      this.shimmerPhase = Math.random() * Math.PI * 2;
      this.inFlight = false;
      this.everStarted = false;
    }
    begin(target, dur, delay) {
      this.sx = this.x; this.sy = this.y;
      this.tx = target.x; this.ty = target.y;
      const dx = this.tx - this.sx, dy = this.ty - this.sy;
      const len = Math.sqrt(dx*dx + dy*dy);
      const px = -dy/(len||1), py = dx/(len||1);
      const curve = (Math.random() - 0.5) * Math.min(60, len * 0.32);
      this.cpx = (this.sx + this.tx)/2 + px*curve;
      this.cpy = (this.sy + this.ty)/2 + py*curve;
      this.delay = delay; this.duration = dur;
      this.tStart = performance.now() + delay;
      this.inFlight = true;
      this.everStarted = true;
    }
    update(now) {
      const elapsed = now - this.tStart;
      if (elapsed < 0) return;
      if (!this.inFlight) return;
      let t = Math.min(1, elapsed / this.duration);
      if (t >= 1) { this.inFlight = false; this.x = this.tx; this.y = this.ty; return; }
      const e = ease(t), u = 1 - e;
      this.x = u*u*this.sx + 2*u*e*this.cpx + e*e*this.tx;
      this.y = u*u*this.sy + 2*u*e*this.cpy + e*e*this.ty;
    }
    draw(now) {
      // Don't render until first transition has started
      if (!this.everStarted) return;
      // Brownian shimmer at draw time only
      let dx = 0, dy = 0;
      if (!this.inFlight) {
        const phase = now * 0.001 + this.shimmerPhase;
        dx = Math.sin(phase * 1.7) * 0.35;
        dy = Math.cos(phase * 2.1) * 0.35;
      }
      const cx = W/2 + this.x + dx;
      const cy = H/2 + this.y + dy;
      let bright = 1, r = this.size;
      if (this.inFlight) {
        const t = Math.min(1, (now - this.tStart) / this.duration);
        bright = Math.max(0, 1 - Math.abs(t - 0.5) * 2);
        r = this.size + 1.2 * bright;
      }
      const a = 0.55 + 0.45 * bright;
      // Soft outer halo (additive)
      const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r * 4);
      grad.addColorStop(0, rgba(this.color, a));
      grad.addColorStop(0.4, rgba(this.color, a * 0.4));
      grad.addColorStop(1, rgba(this.color, 0));
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(cx, cy, r * 4, 0, Math.PI * 2);
      ctx.fill();
      // Sharp inner core
      ctx.fillStyle = rgba(this.color, Math.min(1, a * 1.4));
      ctx.beginPath();
      ctx.arc(cx, cy, r * 0.6, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function sampleBar() {
    const points = [];
    for (let i = 0; i < ATOM_COUNT; i++) {
      points.push({ x: 0, y: ((i / (ATOM_COUNT - 1)) - 0.5) * 200 });
    }
    return points;
  }
  function sampleText(text, fontSize = 88) {
    const Wc = 360, Hc = 200;
    const c = document.createElement('canvas');
    c.width = Wc; c.height = Hc;
    const c2 = c.getContext('2d');
    c2.fillStyle = '#fff';
    c2.font = `300 ${fontSize}px 'SF Pro Display','Inter',system-ui,sans-serif`;
    c2.textBaseline = 'middle'; c2.textAlign = 'center';
    c2.fillText(text, Wc/2, Hc/2);
    const data = c2.getImageData(0, 0, Wc, Hc).data;
    const samples = [];
    for (let y = 0; y < Hc; y += 1)
      for (let x = 0; x < Wc; x += 1)
        if (data[(y*Wc + x)*4 + 3] > 100) samples.push({ x: x - Wc/2, y: y - Hc/2 });
    if (!samples.length) return sampleBar();
    const out = [];
    for (let i = 0; i < ATOM_COUNT; i++) out.push(samples[Math.floor((i/ATOM_COUNT) * samples.length)]);
    for (let i = out.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i+1)); [out[i], out[j]] = [out[j], out[i]]; }
    return out;
  }
  function assign(atoms, targets) {
    const used = new Array(targets.length).fill(false);
    const order = atoms.map((_, i) => i).sort((a, b) => atoms[a].y - atoms[b].y);
    for (const ai of order) {
      const a = atoms[ai];
      let best = -1, bestD = Infinity;
      for (let ti = 0; ti < targets.length; ti++) {
        if (used[ti]) continue;
        const dx = a.x - targets[ti].x, dy = a.y - targets[ti].y;
        const d = dx*dx + dy*dy;
        if (d < bestD) { bestD = d; best = ti; }
      }
      if (best >= 0) { atoms[ai].nextTarget = targets[best]; used[best] = true; }
    }
  }

  const atoms = Array.from({length: ATOM_COUNT}, (_, i) => new Atom(i));
  let raf = null;

  function loop() {
    const now = performance.now();
    // Frame accumulation: fade previous frame slightly instead of clearing
    // This creates real exponentially-decaying motion trails.
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(5, 5, 7, 0.18)';
    ctx.fillRect(0, 0, W, H);
    // Additive blending for atoms
    ctx.globalCompositeOperation = 'lighter';
    for (const a of atoms) {
      a.update(now);
      a.draw(now);
    }
    raf = requestAnimationFrame(loop);
  }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { if (raf) cancelAnimationFrame(raf); raf = null; }
    else if (!raf) raf = requestAnimationFrame(loop);
  });

  function flash(ms) { HALO.classList.add('flash'); setTimeout(() => HALO.classList.remove('flash'), ms); }
  function aberrate(on) { SLOT_WRAP.classList.toggle('aberrating', on); }
  function punch() { SLOT_WRAP.classList.add('punch'); setTimeout(() => SLOT_WRAP.classList.remove('punch'), 140); }

  function transition(state, dur = 1000) {
    let targets;
    if (state === 'bar') targets = sampleBar();
    else if (state === 'files') targets = sampleText('/files', 84);
    else if (state === 'emails') targets = sampleText('/emails', 84);
    else if (state === 'history') targets = sampleText('/history', 76);
    else return;
    assign(atoms, targets);
    atoms.forEach((a, i) => a.begin(a.nextTarget, dur, (i/ATOM_COUNT)*260 + Math.random()*80));
    flash(dur); aberrate(true);
    setTimeout(() => aberrate(false), dur * 0.75);
    setTimeout(punch, dur + 280);
  }

  function reveal() {
    const targets = sampleBar();
    assign(atoms, targets);
    atoms.forEach((a, i) => a.begin(a.nextTarget, 1500, (i/ATOM_COUNT)*700 + Math.random()*200));
    flash(900);
    setTimeout(punch, 2000);
  }

  const cycle = ['files', 'bar', 'emails', 'bar', 'history', 'bar'];
  let i = 0;
  function next() {
    const s = cycle[i % cycle.length];
    const dur = s === 'bar' ? 850 : 1100;
    transition(s, dur);
    const hold = s === 'bar' ? 1600 : 2800;
    i++;
    setTimeout(next, dur + 380 + hold);
  }

  window.addEventListener('load', () => {
    raf = requestAnimationFrame(loop);
    setTimeout(reveal, 2400);
    setTimeout(next, 5400);
  });
  document.getElementById('stage').addEventListener('click', () => location.reload());
})();
</script>
</body>
</html>
