<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Manifold — Iter 01 (Refined Baseline)</title>
<style>
  /* ITERATION 1 — Refined Baseline
     Goal: improve typography, atmosphere, and pacing of the foundational reveal.
     What's new vs v0:
       - Iris-out reveal anchored at each brace's cusp (the place authority lives)
       - Layered halo with subtle parallax breath
       - Real display-grade typography stack (SF Pro Display → Inter Display fallback)
       - Vignette-respectful grain (denser in falloff, almost gone in center)
       - Precise tracking on wordmark; tagline at 32% letter-spacing
     What's NOT here yet: morphing slot. That comes in iter 02. */

  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&display=swap');

  :root {
    --bg-deep:  #050507;
    --bg-lift:  #0F0F12;
    --ink:      #F1ECE0;
    --ink-soft: #D6D0C2;
    --ink-mute: #6A665E;
    --gate:     #FFE0B2;
    --pulse:    #FFFFFF;

    --speed: 1;
    --ease-cinematic: cubic-bezier(0.16, 1, 0.3, 1);
    --ease-confident: cubic-bezier(0.65, 0, 0.35, 1);
    --ease-material: cubic-bezier(0.4, 0, 0.2, 1);
  }

  *,*::before,*::after { margin:0; padding:0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: var(--bg-deep);
    font-family: 'SF Pro Display', 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    text-rendering: geometricPrecision;
    color: var(--ink);
  }

  .stage {
    position: relative;
    width: 100%;
    height: 100vh;
    display: grid;
    place-items: center;
    background:
      radial-gradient(ellipse 65% 50% at 50% 47%, var(--bg-lift) 0%, var(--bg-deep) 70%);
    cursor: pointer;
  }

  /* Grain — denser in periphery, faint in center, mimics film stock */
  .stage::after {
    content: '';
    position: absolute; inset: 0;
    pointer-events: none;
    opacity: 0.5;
    mix-blend-mode: overlay;
    background:
      radial-gradient(ellipse 50% 40% at 50% 50%, transparent 0%, rgba(0,0,0,0.4) 100%),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.92  0 0 0 0 0.90  0 0 0 0 0.84  0 0 0 0.10 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    background-blend-mode: multiply;
  }

  .composition {
    position: relative;
    width: min(760px, 88vw);
    aspect-ratio: 16 / 11;
    display: grid;
    grid-template-rows: 1fr auto auto;
    align-items: center;
    justify-items: center;
  }

  .mark {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    /* Parallax breathing of the entire mark — subtle, no spring */
    animation: mark-breathe 9s ease-in-out infinite;
    animation-delay: 6s;
  }

  /* Layered halos for depth — back layer larger, slower, dimmer */
  .halo, .halo-far {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    opacity: 0;
  }
  .halo {
    width: 240px; height: 360px;
    background: radial-gradient(ellipse 50% 60% at 50% 50%,
      color-mix(in srgb, var(--gate) 38%, transparent) 0%,
      transparent 65%);
    filter: blur(16px);
    animation:
      halo-rise 1100ms var(--ease-confident) 2400ms forwards,
      halo-breathe 7s ease-in-out 4500ms infinite;
  }
  .halo-far {
    width: 480px; height: 480px;
    background: radial-gradient(circle,
      color-mix(in srgb, var(--gate) 12%, transparent) 0%,
      transparent 60%);
    filter: blur(40px);
    animation:
      halo-far-rise 1500ms var(--ease-confident) 2200ms forwards,
      halo-breathe-slow 11s ease-in-out 5000ms infinite;
  }

  /* Seed line — preludes everything */
  .seed {
    position: absolute;
    width: 280px; height: 1px;
    background: linear-gradient(90deg,
      transparent 0%,
      color-mix(in srgb, var(--ink) 50%, transparent) 50%,
      transparent 100%);
    transform: scaleX(0);
    opacity: 0;
    animation:
      seed-in 900ms var(--ease-cinematic) 200ms forwards,
      seed-out 700ms ease-in 2300ms forwards;
  }

  /* Braces — text glyphs with iris-out reveal from cusp */
  .brace {
    font-family: 'SF Pro Display', 'Inter', system-ui, sans-serif;
    font-weight: 200;
    font-size: clamp(200px, 30vw, 300px);
    line-height: 1;
    color: var(--ink);
    display: inline-block;
    opacity: 0;
    /* iris reveal — clip-path circle expands from cusp */
    clip-path: circle(0% at 0% 50%);
    text-shadow:
      0 0 28px color-mix(in srgb, var(--ink) 6%, transparent),
      0 1px 0  color-mix(in srgb, var(--ink) 10%, transparent);  /* faint top edge */
  }

  .brace.left {
    margin-right: 64px;
    clip-path: circle(0% at 0% 50%);   /* cusp is on left */
    animation: iris-left 1500ms var(--ease-cinematic) 1000ms forwards;
  }
  .brace.right {
    margin-left: 64px;
    clip-path: circle(0% at 100% 50%); /* cusp is on right */
    animation: iris-right 1500ms var(--ease-cinematic) 1300ms forwards;
  }

  /* The bar — vertical gate */
  .bar {
    position: absolute;
    width: 4px; height: 220px;
    border-radius: 2px;
    background: linear-gradient(180deg,
      color-mix(in srgb, var(--ink) 78%, transparent) 0%,
      var(--ink) 50%,
      color-mix(in srgb, var(--ink) 78%, transparent) 100%);
    box-shadow:
      0 0 22px color-mix(in srgb, var(--gate) 40%, transparent),
      0 0 6px  color-mix(in srgb, var(--ink) 32%, transparent);
    transform: scaleY(0);
    transform-origin: center;
    opacity: 0;
    animation:
      bar-ignite 1100ms var(--ease-confident) 2500ms forwards,
      bar-shimmer 4s ease-in-out 5500ms infinite;
  }

  .pulse {
    position: absolute;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--pulse);
    box-shadow:
      0 0 10px var(--pulse),
      0 0 22px color-mix(in srgb, var(--gate) 60%, transparent),
      0 0 44px color-mix(in srgb, var(--gate) 28%, transparent);
    opacity: 0;
    transform: translateY(-110px);
    animation:
      pulse-pass 1400ms var(--ease-material) 3900ms forwards,
      pulse-loop 8s var(--ease-material) 6500ms infinite;
  }

  .wordmark {
    margin-top: 56px;
    font-family: 'SF Pro Display', 'Inter', system-ui, sans-serif;
    font-weight: 300;
    font-size: clamp(20px, 2.4vw, 30px);
    letter-spacing: 0.66em;
    text-indent: 0.66em;
    color: var(--ink-soft);
    opacity: 0;
    transform: translateY(8px);
    animation: word-rise 1100ms var(--ease-cinematic) 5000ms forwards;
  }

  .tagline {
    margin-top: 22px;
    font-family: 'SF Pro Display', 'Inter', system-ui, sans-serif;
    font-weight: 300;
    font-size: clamp(10px, 1.05vw, 12px);
    letter-spacing: 0.34em;
    text-indent: 0.34em;
    color: var(--ink-mute);
    opacity: 0;
    animation: tag-rise 900ms ease-out 5800ms forwards;
  }

  /* ----- KEYFRAMES ----- */

  @keyframes seed-in {
    0%   { transform: scaleX(0); opacity: 0; }
    100% { transform: scaleX(1); opacity: 0.9; }
  }
  @keyframes seed-out { to { opacity: 0; } }

  @keyframes iris-left {
    0%   { clip-path: circle(0% at 0% 50%); opacity: 0; }
    20%  { opacity: 1; }
    100% { clip-path: circle(140% at 0% 50%); opacity: 1; }
  }
  @keyframes iris-right {
    0%   { clip-path: circle(0% at 100% 50%); opacity: 0; }
    20%  { opacity: 1; }
    100% { clip-path: circle(140% at 100% 50%); opacity: 1; }
  }

  @keyframes bar-ignite {
    0%   { transform: scaleY(0);    opacity: 0; }
    50%  { transform: scaleY(1.06); opacity: 1; }
    80%  { transform: scaleY(0.98); }
    100% { transform: scaleY(1);    opacity: 1; }
  }
  @keyframes bar-shimmer {
    0%, 100% { box-shadow: 0 0 22px color-mix(in srgb, var(--gate) 40%, transparent),
                           0 0 6px  color-mix(in srgb, var(--ink) 32%, transparent); }
    50%      { box-shadow: 0 0 30px color-mix(in srgb, var(--gate) 55%, transparent),
                           0 0 8px  color-mix(in srgb, var(--ink) 38%, transparent); }
  }

  @keyframes halo-rise {
    0%   { opacity: 0; transform: scale(0.85); }
    100% { opacity: 0.55; transform: scale(1); }
  }
  @keyframes halo-far-rise {
    0%   { opacity: 0; transform: scale(0.7); }
    100% { opacity: 0.6; transform: scale(1); }
  }
  @keyframes halo-breathe {
    0%, 100% { opacity: 0.45; }
    50%      { opacity: 0.7; }
  }
  @keyframes halo-breathe-slow {
    0%, 100% { opacity: 0.5; }
    50%      { opacity: 0.7; }
  }

  @keyframes pulse-pass {
    0%   { transform: translateY(-110px); opacity: 0; }
    15%  { opacity: 1; }
    85%  { opacity: 1; }
    100% { transform: translateY(110px); opacity: 0; }
  }
  @keyframes pulse-loop {
    0%, 90%  { transform: translateY(-110px); opacity: 0; }
    93%      { opacity: 1; }
    99%      { opacity: 1; }
    100%     { transform: translateY(110px); opacity: 0; }
  }

  @keyframes word-rise {
    0%   { opacity: 0; transform: translateY(8px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  @keyframes tag-rise { to { opacity: 0.85; } }

  @keyframes mark-breathe {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-2px); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .seed { display: none; }
    .brace, .bar, .halo, .halo-far, .pulse, .wordmark, .tagline {
      opacity: 1; clip-path: none; transform: none;
    }
  }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="composition">
      <div class="mark">
        <div class="halo-far" aria-hidden="true"></div>
        <div class="halo" aria-hidden="true"></div>
        <div class="seed" aria-hidden="true"></div>
        <span class="brace left" aria-hidden="true">{</span>
        <div class="bar" aria-hidden="true"></div>
        <div class="pulse" aria-hidden="true"></div>
        <span class="brace right" aria-hidden="true">}</span>
      </div>
      <div class="wordmark">MANIFOLD</div>
      <div class="tagline">ACCESS, RECORDED.</div>
    </div>
  </div>
  <script>
    document.getElementById('stage').addEventListener('click', () => location.reload());
  </script>
</body>
</html>
