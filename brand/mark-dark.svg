<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img" aria-label="Manifold brand mark">
  <title>Manifold</title>
  <desc>{ | } — the brand mark for Manifold. Set-builder notation: scope, policy, broker.</desc>

  <defs>
    <linearGradient id="braceGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FFFCF2"/>
      <stop offset="50%"  stop-color="#F1ECE0"/>
      <stop offset="100%" stop-color="#B8B0A0"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#F1ECE0" stop-opacity="0.78"/>
      <stop offset="50%"  stop-color="#F1ECE0"/>
      <stop offset="100%" stop-color="#F1ECE0" stop-opacity="0.78"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#FFE0B2" stop-opacity="0.42"/>
      <stop offset="65%" stop-color="#FFE0B2" stop-opacity="0"/>
    </radialGradient>
    <filter id="braceBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
  </defs>

  <!-- Background not included — SVG is transparent for layering -->

  <!-- Halo -->
  <ellipse cx="200" cy="120" rx="80" ry="100" fill="url(#halo)"/>

  <!-- Left brace -->
  <g transform="translate(80, 0)" filter="url(#braceBlur)">
    <path d="M 64 8 C 36 8, 26 18, 26 40 L 26 100
             C 26 110, 18 116, 6 120
             C 18 124, 26 130, 26 140 L 26 200
             C 26 222, 36 232, 64 232"
          fill="none" stroke="url(#braceGrad)" stroke-width="3.5"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 64 8 C 36 8, 26 18, 26 40 L 26 100
             C 26 110, 18 116, 6 120
             C 18 124, 26 130, 26 140 L 26 200
             C 26 222, 36 232, 64 232"
          fill="none" stroke="rgba(255,255,255,0.20)" stroke-width="0.8"
          stroke-linecap="round" transform="translate(0,-0.5)"/>
  </g>

  <!-- Vertical bar -->
  <rect x="198" y="50" width="4" height="140" rx="2" fill="url(#barGrad)"/>

  <!-- Right brace -->
  <g transform="translate(240, 0)" filter="url(#braceBlur)">
    <path d="M 16 8 C 44 8, 54 18, 54 40 L 54 100
             C 54 110, 62 116, 74 120
             C 62 124, 54 130, 54 140 L 54 200
             C 54 222, 44 232, 16 232"
          fill="none" stroke="url(#braceGrad)" stroke-width="3.5"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 16 8 C 44 8, 54 18, 54 40 L 54 100
             C 54 110, 62 116, 74 120
             C 62 124, 54 130, 54 140 L 54 200
             C 54 222, 44 232, 16 232"
          fill="none" stroke="rgba(255,255,255,0.20)" stroke-width="0.8"
          stroke-linecap="round" transform="translate(0,-0.5)"/>
  </g>
</svg>
