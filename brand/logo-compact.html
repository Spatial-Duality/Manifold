<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Manifold — Compact Logo</title>
<style>
  /* COMPACT LOGO
     Stripped-down version of the title sequence for use as a small brand mark
     in app chrome, sidebar headers, footers, or anywhere the full sequence
     would be too theatrical.

     - No halo cycles, no seed line, no wordmark, no tagline
     - Direct: braces appear, slot ignites, morph cycle plays
     - Sized for ~120-220px height embedding
     - All animations on .stage cycle indefinitely with longer holds */

  :root {
    --bg-deep: transparent;       /* allow embedding on any background */
    --ink: #F1ECE0;
    --ink-warm: #FFD9A0;
    --ink-cold: #B8C8E0;
    --gate: #FFE0B2;
    --pulse: #FFFFFF;
    --ease-cinematic: cubic-bezier(0.16, 1, 0.3, 1);
    --ease-confident: cubic-bezier(0.65, 0, 0.35, 1);
    --ease-material: cubic-bezier(0.4, 0, 0.2, 1);
  }

  *,*::before,*::after { margin:0; padding:0; box-sizing: border-box; }
  html, body {
    height: 100%; background: #050507;
    font-family: 'SF Pro Display','Inter',system-ui,sans-serif;
    overflow: hidden; -webkit-font-smoothing: antialiased; color: var(--ink);
  }

  .stage {
    width: 100%; height: 100vh;
    display: grid; place-items: center;
  }

  .mark {
    position: relative;
    width: 360px; height: 160px;
    display: flex; align-items: center; justify-content: center;
  }

  /* Subtle near halo only — no layered cold/far halos for compactness */
  .halo {
    position: absolute;
    width: 200px; height: 220px;
    background: radial-gradient(ellipse 50% 60% at 50% 50%,
      color-mix(in srgb, var(--gate) 35%, transparent) 0%, transparent 65%);
    filter: blur(14px);
    opacity: 0;
    transition: opacity 280ms var(--ease-material);
    pointer-events: none;
    animation: halo-rise 900ms var(--ease-confident) 600ms forwards;
  }
  .halo.flash { opacity: 0.85 !important; }

  /* Brace SVGs — same paths as iter 5 but smaller */
  .brace-svg { height: 130px; width: auto; overflow: visible; opacity: 0; }
  .brace-svg.left {
    margin-right: 60px;
    clip-path: circle(0% at 0% 50%);
    animation: iris-left 1100ms var(--ease-cinematic) 400ms forwards;
  }
  .brace-svg.right {
    margin-left: 60px;
    clip-path: circle(0% at 100% 50%);
    animation: iris-right 1100ms var(--ease-cinematic) 600ms forwards;
  }

  .slot-wrap { position: absolute; width: 220px; height: 180px; pointer-events: none; }
  .slot-svg { position: absolute; inset: 0; overflow: visible; }
  .slot-svg.bloom { filter: blur(4px) saturate(1.3); mix-blend-mode: screen; opacity: 0.4; }
  .slot-svg.front circle { fill: var(--ink); }
  .slot-svg.bloom circle { fill: var(--ink-warm); }
  .slot-svg .trail circle { fill: var(--ink-warm); }

  .slot-wrap.aberrating .slot-svg.front {
    filter: drop-shadow(0.8px 0 0 rgba(255, 120, 120, 0.5))
            drop-shadow(-0.8px 0 0 rgba(120, 160, 255, 0.5));
  }
  .slot-wrap.punch .slot-svg.front {
    filter: brightness(1.3) drop-shadow(0 0 4px var(--pulse));
  }
  .slot-wrap.aberrating, .slot-wrap.punch {
    transition: filter 180ms var(--ease-material);
  }

  @keyframes iris-left { 0%{clip-path:circle(0% at 0% 50%);opacity:0;} 18%{opacity:1;} 100%{clip-path:circle(140% at 0% 50%);opacity:1;} }
  @keyframes iris-right { 0%{clip-path:circle(0% at 100% 50%);opacity:0;} 18%{opacity:1;} 100%{clip-path:circle(140% at 100% 50%);opacity:1;} }
  @keyframes halo-rise { to { opacity: 0.5; } }

  @media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation: none !important; } }
</style>
</head>
<body>
<div class="stage">
  <div class="mark">
    <div class="halo" id="halo" aria-hidden="true"></div>

    <svg class="brace-svg left" viewBox="0 0 80 240" aria-hidden="true">
      <defs>
        <linearGradient id="brL" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#FFFCF2"/>
          <stop offset="50%" stop-color="#F1ECE0"/>
          <stop offset="100%" stop-color="#B8B0A0"/>
        </linearGradient>
      </defs>
      <path d="M 64 8 C 36 8, 26 18, 26 40 L 26 100 C 26 110, 18 116, 6 120 C 18 124, 26 130, 26 140 L 26 200 C 26 222, 36 232, 64 232"
            fill="none" stroke="url(#brL)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>

    <div class="slot-wrap" id="slotWrap">
      <svg class="slot-svg bloom" viewBox="-110 -90 220 180"><g id="atomsBloom"></g></svg>
      <svg class="slot-svg front" viewBox="-110 -90 220 180">
        <g id="trails"></g>
        <g id="atoms"></g>
      </svg>
    </div>

    <svg class="brace-svg right" viewBox="0 0 80 240" aria-hidden="true">
      <defs>
        <linearGradient id="brR" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#FFFCF2"/>
          <stop offset="50%" stop-color="#F1ECE0"/>
          <stop offset="100%" stop-color="#B8B0A0"/>
        </linearGradient>
      </defs>
      <path d="M 16 8 C 44 8, 54 18, 54 40 L 54 100 C 54 110, 62 116, 74 120 C 62 124, 54 130, 54 140 L 54 200 C 54 222, 44 232, 16 232"
            fill="none" stroke="url(#brR)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
</div>

<script>
(function () {
  const ATOM_COUNT = 80;       // fewer atoms — compact context
  const TRAIL_LENGTH = 2;
  const SVG_NS = 'http://www.w3.org/2000/svg';
  const FRONT = document.getElementById('atoms');
  const BLOOM = document.getElementById('atomsBloom');
  const TRAILS = document.getElementById('trails');
  const HALO = document.getElementById('halo');
  const SLOT_WRAP = document.getElementById('slotWrap');

  function ease(t) { return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2; }

  class Atom {
    constructor(idx) {
      this.el = document.createElementNS(SVG_NS, 'circle');
      this.el.setAttribute('r', 1.0);
      this.el.style.opacity = 0;
      const r = Math.random();
      this.el.style.fill = r < 0.94 ? 'var(--ink)' : (r < 0.99 ? 'var(--ink-warm)' : 'var(--ink-cold)');
      FRONT.appendChild(this.el);
      this.bloom = document.createElementNS(SVG_NS, 'circle');
      this.bloom.setAttribute('r', 1.8);
      this.bloom.style.opacity = 0;
      BLOOM.appendChild(this.bloom);
      this.trail = [];
      for (let i = 0; i < TRAIL_LENGTH; i++) {
        const t = document.createElementNS(SVG_NS, 'circle');
        t.setAttribute('r', 0.7); t.style.opacity = 0; t.style.fill = 'var(--ink-warm)';
        TRAILS.appendChild(t);
        this.trail.push({ el: t, x: 0, y: 0 });
      }
      this.x = (Math.random() - 0.5) * 400;
      this.y = (Math.random() - 0.5) * 300;
      this.sx = this.x; this.sy = this.y;
      this.tx = 0; this.ty = 0;
      this.cpx = 0; this.cpy = 0;
      this.delay = 0; this.duration = 800; this.tStart = 0;
      const t = (idx / (ATOM_COUNT - 1) - 0.5) * 2;
      this.size = 1.15 - Math.abs(t) * 0.25;
      this.shimmerPhase = Math.random() * Math.PI * 2;
      this.inFlight = false;
    }
    begin(target, dur, delay) {
      this.sx = this.x; this.sy = this.y;
      this.tx = target.x; this.ty = target.y;
      const dx = this.tx - this.sx, dy = this.ty - this.sy;
      const len = Math.sqrt(dx*dx + dy*dy);
      const px = -dy/(len||1), py = dx/(len||1);
      const curve = (Math.random() - 0.5) * Math.min(35, len * 0.3);
      this.cpx = (this.sx + this.tx)/2 + px*curve;
      this.cpy = (this.sy + this.ty)/2 + py*curve;
      this.delay = delay; this.duration = dur;
      this.tStart = performance.now() + delay;
      this.inFlight = true;
      for (const t of this.trail) { t.x = this.sx; t.y = this.sy; t.el.style.opacity = 0; }
    }
    update(now) {
      const elapsed = now - this.tStart;
      if (elapsed < 0) return;
      if (!this.inFlight) {
        const phase = now * 0.001 + this.shimmerPhase;
        const sx = Math.sin(phase * 1.7) * 0.22, sy = Math.cos(phase * 2.1) * 0.22;
        this.el.setAttribute('cx', (this.x + sx).toFixed(2));
        this.el.setAttribute('cy', (this.y + sy).toFixed(2));
        this.bloom.setAttribute('cx', (this.x + sx).toFixed(2));
        this.bloom.setAttribute('cy', (this.y + sy).toFixed(2));
        return;
      }
      let t = Math.min(1, elapsed / this.duration);
      if (t >= 1) { this.inFlight = false; this.x = this.tx; this.y = this.ty; }
      const e = ease(t), u = 1 - e;
      this.x = u*u*this.sx + 2*u*e*this.cpx + e*e*this.tx;
      this.y = u*u*this.sy + 2*u*e*this.cpy + e*e*this.ty;
      const bright = 1 - Math.abs(t - 0.5) * 2;
      const op = 0.55 + 0.45 * (this.inFlight ? bright : 1);
      const r = this.size + 0.4 * bright;
      this.el.setAttribute('cx', this.x.toFixed(2));
      this.el.setAttribute('cy', this.y.toFixed(2));
      this.el.style.opacity = op;
      this.el.setAttribute('r', r.toFixed(2));
      this.bloom.setAttribute('cx', this.x.toFixed(2));
      this.bloom.setAttribute('cy', this.y.toFixed(2));
      this.bloom.style.opacity = op * 0.4;
      this.bloom.setAttribute('r', (r * 1.6).toFixed(2));
      for (let i = this.trail.length - 1; i > 0; i--) {
        this.trail[i].x = this.trail[i-1].x;
        this.trail[i].y = this.trail[i-1].y;
      }
      this.trail[0].x = this.x; this.trail[0].y = this.y;
      for (let i = 0; i < this.trail.length; i++) {
        const tr = this.trail[i];
        tr.el.setAttribute('cx', tr.x.toFixed(2));
        tr.el.setAttribute('cy', tr.y.toFixed(2));
        tr.el.style.opacity = (this.inFlight ? (1 - i/this.trail.length) * 0.4 * bright : 0);
        tr.el.setAttribute('r', (this.size * 0.6).toFixed(2));
      }
    }
  }

  function sampleBar() {
    return Array.from({length: ATOM_COUNT}, (_, i) => ({
      x: 0, y: ((i / (ATOM_COUNT - 1)) - 0.5) * 130
    }));
  }
  function sampleText(text, fontSize = 56) {
    const W = 220, H = 130;
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.font = `300 ${fontSize}px 'SF Pro Display','Inter',system-ui,sans-serif`;
    ctx.textBaseline = 'middle'; ctx.textAlign = 'center';
    ctx.fillText(text, W/2, H/2);
    const data = ctx.getImageData(0, 0, W, H).data;
    const samples = [];
    for (let y = 0; y < H; y += 2)
      for (let x = 0; x < W; x += 2)
        if (data[(y*W + x)*4 + 3] > 100) samples.push({ x: x - W/2, y: y - H/2 });
    if (!samples.length) return sampleBar();
    const out = [];
    for (let i = 0; i < ATOM_COUNT; i++) out.push(samples[Math.floor((i/ATOM_COUNT) * samples.length)]);
    for (let i = out.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i+1)); [out[i], out[j]] = [out[j], out[i]]; }
    return out;
  }
  function assign(atoms, targets) {
    const used = new Array(targets.length).fill(false);
    const order = atoms.map((_, i) => i).sort((a, b) => atoms[a].y - atoms[b].y);
    for (const ai of order) {
      const a = atoms[ai];
      let best = -1, bestD = Infinity;
      for (let ti = 0; ti < targets.length; ti++) {
        if (used[ti]) continue;
        const dx = a.x - targets[ti].x, dy = a.y - targets[ti].y;
        const d = dx*dx + dy*dy;
        if (d < bestD) { bestD = d; best = ti; }
      }
      if (best >= 0) { atoms[ai].nextTarget = targets[best]; used[best] = true; }
    }
  }

  const atoms = Array.from({length: ATOM_COUNT}, (_, i) => new Atom(i));
  let raf = null;
  function loop() { const now = performance.now(); for (const a of atoms) a.update(now); raf = requestAnimationFrame(loop); }
  raf = requestAnimationFrame(loop);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { if (raf) cancelAnimationFrame(raf); raf = null; }
    else if (!raf) raf = requestAnimationFrame(loop);
  });

  function flash(ms) { HALO.classList.add('flash'); setTimeout(() => HALO.classList.remove('flash'), ms); }
  function aberrate(on) { SLOT_WRAP.classList.toggle('aberrating', on); }
  function punch() { SLOT_WRAP.classList.add('punch'); setTimeout(() => SLOT_WRAP.classList.remove('punch'), 130); }

  function transition(state, dur = 800) {
    let targets;
    if (state === 'bar') targets = sampleBar();
    else if (state === 'files') targets = sampleText('/files', 54);
    else if (state === 'emails') targets = sampleText('/emails', 54);
    else if (state === 'history') targets = sampleText('/history', 48);
    else return;
    assign(atoms, targets);
    atoms.forEach((a, i) => a.begin(a.nextTarget, dur, (i/ATOM_COUNT)*180 + Math.random()*60));
    flash(dur);
    aberrate(true);
    setTimeout(() => aberrate(false), dur * 0.75);
    setTimeout(punch, dur + 220);
  }

  function reveal() {
    const targets = sampleBar();
    assign(atoms, targets);
    atoms.forEach((a, i) => a.begin(a.nextTarget, 1100, (i/ATOM_COUNT)*500 + Math.random()*120));
    flash(700);
  }

  const cycle = ['files', 'bar', 'emails', 'bar', 'history', 'bar'];
  let i = 0;
  function next() {
    const s = cycle[i % cycle.length];
    const dur = s === 'bar' ? 700 : 900;
    transition(s, dur);
    const hold = s === 'bar' ? 1400 : 2400;
    i++;
    setTimeout(next, dur + 300 + hold);
  }

  window.addEventListener('load', () => {
    setTimeout(reveal, 800);
    setTimeout(next, 3200);
  });
})();
</script>
</body>
</html>
