name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build release
        env:
          MANIFOLD_CODESIGN_IDENTITY: ${{ secrets.MANIFOLD_CODESIGN_IDENTITY }}
          MANIFOLD_NOTARY_PROFILE: ${{ secrets.MANIFOLD_NOTARY_PROFILE }}
          MANIFOLD_REQUIRE_SIGNED_RELEASE: "1"
          MANIFOLD_REQUIRE_NOTARIZATION: "1"
        run: bash ManifoldApp/build.sh release

      - name: Validate release posture
        run: bash script/validate_release_posture.sh --app ManifoldApp/build/Manifold.app --require-signed-app

      - name: Get version
        id: version
        run: echo "version=$(cat VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Manifold v${{ steps.version.outputs.version }}
          files: ManifoldApp/build/Manifold-*.zip
          generate_release_notes: true
