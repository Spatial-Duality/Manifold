name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build release binary
        run: swift build -c release --product ManifoldApp

      - name: Create app bundle
        run: |
          mkdir -p ManifoldApp.app/Contents/MacOS
          cp .build/release/ManifoldApp ManifoldApp.app/Contents/MacOS/
          cp ManifoldApp/build/ManifoldApp.app/Contents/Info.plist ManifoldApp.app/Contents/

      - name: Create zip
        run: zip -r Manifold-${{ github.ref_name }}-arm64.zip ManifoldApp.app

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: Manifold-${{ github.ref_name }}-arm64.zip
          generate_release_notes: true
