name: CI

on:
  push:
    branches: [main, "feat/*"]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build Swift package
        run: |
          set -o pipefail
          swift build 2>&1 | tee /tmp/manifold-swift-build.log
          if grep -n "warning:" /tmp/manifold-swift-build.log; then
            echo "Unexpected Swift package warnings detected"
            exit 1
          fi

      - name: Test Swift package
        run: swift test

      - name: Build Xcode app
        run: |
          set -o pipefail
          xcodebuild -project Manifold.xcodeproj \
            -scheme Manifold \
            -configuration Debug \
            -derivedDataPath "$GITHUB_WORKSPACE/.deriveddata-app-build" \
            build \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee /tmp/manifold-xcode-build.log
          if grep -n "warning:" /tmp/manifold-xcode-build.log | grep -v "^--- xcodebuild: WARNING: Using the first of multiple matching destinations:"; then
            echo "Unexpected Xcode build warnings detected"
            exit 1
          fi

      - name: Validate release settings
        run: bash script/validate_release_posture.sh

      - name: Run app unit and integration tests
        run: |
          xcodebuild -project Manifold.xcodeproj \
            -scheme Manifold \
            -configuration Debug \
            -derivedDataPath "$GITHUB_WORKSPACE/.deriveddata-app-tests" \
            test \
            -only-testing:ManifoldAppTests \
            CODE_SIGNING_ALLOWED=NO

      - name: Run fixture-mode UI tests
        run: |
          bash script/run_ui_tests.sh \
            --derived-data "$GITHUB_WORKSPACE/.deriveddata-ui-tests"

      - name: Build app bundle (release)
        if: github.ref == 'refs/heads/main'
        run: bash ManifoldApp/build.sh release

      - name: Validate release bundle
        if: github.ref == 'refs/heads/main'
        run: bash script/validate_release_posture.sh --app ManifoldApp/build/Manifold.app

      - name: Upload artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: Manifold.app
          path: ManifoldApp/build/Manifold-*.zip
